name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [mc1.21.11, mc26.2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify geometry
        run: ./gradlew -p "${{ matrix.target }}" -I "$PWD/verification/audit.init.gradle" build auditCenterGeometry --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: artmap-grid-${{ matrix.target }}
          path: |
            ${{ matrix.target }}/build/libs/*.jar
            !${{ matrix.target }}/build/libs/*-sources.jar
          if-no-files-found: error

