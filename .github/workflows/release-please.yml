name: Release Please and publish JARs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-please
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect first publication
        id: initial
        shell: bash
        run: |
          count=$(gh release list --limit 1 --json tagName --jq 'length')
          if [ "$count" = 0 ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "tag=v$(tr -d '\r\n' < version.txt)" >> "$GITHUB_OUTPUT"
          fi
      - uses: googleapis/release-please-action@v4
        id: release
        if: steps.initial.outputs.bootstrap != 'true'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Build and upload in this workflow: releases made with GITHUB_TOKEN do not
      # trigger another release-event workflow.
      - uses: actions/checkout@v4
        if: steps.initial.outputs.bootstrap == 'true' || steps.release.outputs.release_created == 'true'
        with:
          ref: ${{ steps.release.outputs.sha || github.sha }}
      - uses: actions/setup-java@v4
        if: steps.initial.outputs.bootstrap == 'true' || steps.release.outputs.release_created == 'true'
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.initial.outputs.bootstrap == 'true' || steps.release.outputs.release_created == 'true'
      - name: Build all Minecraft versions
        if: steps.initial.outputs.bootstrap == 'true' || steps.release.outputs.release_created == 'true'
        run: |
          ./gradlew -p mc1.21.11 -I "$PWD/verification/audit.init.gradle" build auditCenterGeometry --no-configuration-cache
          ./gradlew -p mc26.2 -I "$PWD/verification/audit.init.gradle" build auditCenterGeometry --no-configuration-cache
          ./gradlew -p mc26.3 -I "$PWD/verification/audit.init.gradle" build auditCenterGeometry --no-configuration-cache
      - name: Publish JARs and checksums
        if: steps.initial.outputs.bootstrap == 'true' || steps.release.outputs.release_created == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name || steps.initial.outputs.tag }}
        shell: bash
        run: |
          mkdir -p artifacts
          find mc1.21.11/build/libs mc26.2/build/libs mc26.3/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -exec cp {} artifacts/ \;
          test "$(find artifacts -name '*.jar' | wc -l)" = 3
          (cd artifacts && sha256sum *.jar > SHA256SUMS.txt)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "ArtMap Grid ${RELEASE_TAG#v}" --notes-file CHANGELOG.md
          fi
          gh release upload "$RELEASE_TAG" artifacts/*.jar artifacts/SHA256SUMS.txt --clobber


